name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Verify TOTP detection with disposable data
        run: GITLEAKS_BIN="$(go env GOPATH)/bin/gitleaks" python3 scripts/test-secret-scan.py
      - name: Scan source tree, including test fixtures
        run: '"$(go env GOPATH)/bin/gitleaks" dir --redact --no-banner .'
